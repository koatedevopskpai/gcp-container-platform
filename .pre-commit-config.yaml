# ============================================================================
# Pre-commit Hooks — SecondWave GCP Container Platform
# ============================================================================
# ARCHITECTURE DECISION: Pre-commit for local validation
# Pre-commit hooks run on `git commit` to catch issues before they reach
# CI. This is faster than waiting for CI feedback and reduces pipeline
# failures. All hooks are maintained centrally in .pre-commit-config.yaml.
#
# Install:
#   pre-commit install
# ============================================================================

repos:
  # --------------------------------------------------------------------------
  # General hooks
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # --------------------------------------------------------------------------
  # Terraform hooks
  # --------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_tflint
        args:
          - --args=--config=.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--severity=CRITICAL,HIGH
      - id: terraform_checkov
        args:
          - --args=--config-file=.checkov.yml
      - id: terraform_docs
        args:
          - --args=--output-file=README.md
          - --args=--output-mode=inject

  # --------------------------------------------------------------------------
  # Markdown hooks
  # --------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--config=.markdownlint.yaml]

  # --------------------------------------------------------------------------
  # Shell script hooks
  # --------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # --------------------------------------------------------------------------
  # Go hooks (for tests)
  # --------------------------------------------------------------------------
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.0
    hooks:
      - id: go-fmt
      - id: go-imports
        args: [-local=github.com/secondwave]
      - id: go-vet
      - id: go-unit-tests
        args: [--race, ./tests/...]

  # --------------------------------------------------------------------------
  # YAML validation
  # --------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - --config-file=.yamllint.yaml
